<style>

</style></head><body>
<header class="sticky top-0 z-20 bg-white/95 border-b border-slate-100 backdrop-blur"><div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center gap-4"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-2xl grid place-items-center text-xl" style="background:#f0edff">✿</div><div><div class="text-xl font-semibold">Agenda <span style="color:var(--a)">Bloom</span></div><div class="text-xs muted hidden sm:block">Organiza hoy, consigue mañana</div></div></div><input id="search" class="field max-w-md mx-auto hidden md:block" placeholder="Buscar eventos o asignaturas…" oninput="render()"><div class="ml-auto flex items-center gap-2"><span id="syncdot" class="dot" style="background:#d6a34a"></span><span id="synctext" class="text-xs muted hidden sm:inline">Guardado local</span><button class="btn" onclick="settings()">⚙ Ajustes</button></div></div></header>
<div class="max-w-[1600px] mx-auto p-3 lg:p-5"><div class="layout grid gap-4" style="grid-template-columns:215px minmax(0,1fr) 275px">

<main class="main min-w-0 space-y-4"><section id="calendarCard" class="card p-3 sm:p-5"><div class="flex flex-wrap items-center gap-2 mb-4"><div class="rounded-xl p-1" style="background:#f6f6fb"><button class="btn" onclick="view='day';render()">Día</button><button class="btn" onclick="view='week';render()">Semana</button><button class="btn" onclick="view='month';render()">Mes</button><button class="btn" onclick="view='agenda';render()">Agenda</button></div><button class="btn" onclick="move(-1)">‹</button><button class="btn" onclick="move(1)">›</button><button class="btn" onclick="today()">Hoy</button><b id="period" class="ml-auto"></b><button class="btn primary" onclick="eventForm()">＋ Añadir</button></div><div id="calendar"></div></section><section id="dayCard" class="card p-4 sm:p-5"><div class="flex justify-between mb-4"><div><h2 id="daytitle" class="font-semibold text-lg"></h2><p id="daymeta" class="text-xs muted mt-1"></p></div><button class="btn" onclick="eventForm()">＋ Añadir evento</button></div><div id="dayevents" class="space-y-2"></div></section><section id="subjectPage" class="card p-5 hide"><div class="flex justify-between mb-4"><h2 class="font-semibold text-lg">Asignaturas</h2><button class="btn primary" onclick="subjectForm()">＋ Nueva</button></div><div id="subjectmanage" class="grid sm:grid-cols-2 gap-3"></div></section><section id="statsPage" class="card p-5 hide"><h2 class="font-semibold text-lg mb-4">Resumen de actividad</h2><div id="stats"></div></section></main>
<aside class="right space-y-4"><section class="card p-4"><h3 class="font-semibold mb-2">Detalles del día</h3><p id="rightdate" class="text-xs muted mb-3"></p><div id="rightdetails" class="space-y-2"></div><button class="btn w-full mt-3" onclick="eventForm()">＋ Añadir evento</button></section><section class="card p-4"><h3 class="font-semibold mb-4">Resumen del mes</h3><div id="summary" class="space-y-3"></div></section><section class="card p-4"><h3 class="font-semibold mb-2">Sincronización automática</h3><p id="cloudstatus" class="text-sm">Guardado local</p><p id="cloudsub" class="text-xs muted mt-1">Se sincroniza con la hoja compartida.</p><button class="btn w-full mt-3" onclick="sync()">↻ Sincronizar ahora</button></section></aside></div>
<nav class="mobile fixed bottom-0 left-0 right-0 bg-white border-t p-2 justify-around z-30"><button class="nav" onclick="page='calendar';render()">▦ Calendario</button><button class="nav" onclick="page='subjects';render()">◉ Asignaturas</button><button class="nav" onclick="page='stats';render()">▥ Resumen</button></nav></div><div id="modal"></div><div id="toast"></div>
<script>
const URL_SCRIPT='https://script.google.com/macros/s/AKfycbwaEc8fbeqndv7qRWlNapUbcTwPZa7DsY76Uc2licXcVEgaMOHTVJkOlNOUkJV9vrew/exec', KEY='agendaBloom.v1';
const CATS=['Exámenes','Entregas','Tascas','Planning'],CATCOL={'Exámenes':'#e88bc5','Entregas':'#83aaf7','Tascas':'#8bcdb9','Planning':'#c3a4f7'},PALETTES=[['Lila','#9482e8','#f0edff'],['Rosa','#e58bb9','#fff0f7'],['Menta','#65bba5','#e9f8f3'],['Azul','#76a1ed','#edf4ff'],['Melocotón','#e9a17e','#fff3eb']],SUBCOL=['#e88bc5','#83aaf7','#8bcdb9','#f2d47b','#ffa889','#c3a4f7','#8ab8c5'];
const uid=()=>Math.random().toString(36).slice(2,10),todayISO=()=>{let d=new Date();return iso(d)},iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,D=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},plus=(s,n)=>{let d=D(s);d.setDate(d.getDate()+n);return iso(d)},fmt=(s,opt={weekday:'long',day:'numeric',month:'long',year:'numeric'})=>D(s).toLocaleDateString('es-ES',opt),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return {schema:1,updatedAt:Date.now(),theme:0,subjects:[{id:'mat',name:'Matemáticas',color:SUBCOL[0],visible:true},{id:'fis',name:'Física',color:SUBCOL[1],visible:true},{id:'qui',name:'Química',color:SUBCOL[2],visible:true},{id:'len',name:'Lengua',color:SUBCOL[3],visible:true},{id:'ing',name:'Inglés',color:SUBCOL[4],visible:true}].map(s=>({...s,categoryVisibility:Object.fromEntries(CATS.map(c=>[c,true]))})),events:[],filters:Object.fromEntries(CATS.map(c=>[c,true])),showCompleted:true}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d?.schema===1&&Array.isArray(d.events)&&Array.isArray(d.subjects))return d}catch(e){}return fresh()}
let data=load(),view='month',cursor=todayISO(),selected=todayISO(),page='calendar',remoteVersion=0,busy=false,dirty=false,saveTimer;
if(!data.filters||typeof data.filters!=='object')data.filters=Object.fromEntries(CATS.map(c=>[c,true]));CATS.forEach(c=>{if(data.filters[c]===undefined)data.filters[c]=true});if(data.showCompleted===undefined)data.showCompleted=true;
// Migra una sola vez los colores guardados por versiones anteriores: antes se guardaba
// el color automático como si fuera personalizado y eso impedía aplicar la escala por categoría.
if(!data.colorScaleV3){data.subjects.forEach(s=>{s.categoryVisibility=s.categoryVisibility&&typeof s.categoryVisibility==='object'?s.categoryVisibility:Object.fromEntries(CATS.map(c=>[c,true]));delete s.sections});data.events.forEach(e=>{delete e.sectionId;e.customColor=''});data.colorScaleV3=true;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function subject(id){return data.subjects.find(s=>s.id===id)}
function categoryVisible(s,cat){if(!s)return true;if(!s.categoryVisibility||typeof s.categoryVisibility!=='object')s.categoryVisibility=Object.fromEntries(CATS.map(c=>[c,true]));return s.categoryVisibility[cat]!==false}
function sectionBase(e){return subject(e.subjectId)?.color||'#bbc2d4'}
function lighten(hex, amount){let h=String(hex||'#bbc2d4').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);if(!Number.isFinite(n))return '#e8eaf2';let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const mix=v=>Math.round(v+(255-v)*amount);return '#'+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function color(e){const base=sectionBase(e);const automatic=e.type==='Exámenes'?base:e.type==='Entregas'?lighten(base,.22):e.type==='Tascas'?lighten(base,.43):e.type==='Planning'?lighten(base,.66):base;return e.customColor&&e.customColor.toLowerCase()!==automatic.toLowerCase()?e.customColor:automatic}function visible(e){let s=subject(e.subjectId);return (!s||s.visible)&&(!s||categoryVisible(s,e.type))&&data.filters[e.type]!==false&&(data.showCompleted!==false||e.type==='Exámenes'||!e.done)}function matches(e){let q=(document.getElementById('search')?.value||'').toLowerCase().trim();return !q||[e.title,e.notes,subject(e.subjectId)?.name,e.type].some(x=>String(x||'').toLowerCase().includes(q))}function events(date){return data.events.filter(e=>e.date===date&&visible(e)&&matches(e)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function persist(){data.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(data));dirty=true;status('local','Guardado local','Cambios pendientes de sincronizar.');clearTimeout(saveTimer);saveTimer=setTimeout(sync,1300)}
function status(k,t,s){document.getElementById('syncdot').style.background={local:'#d6a34a',ok:'#54b89b',err:'#e58c8c',busy:'#9482e8'}[k];document.getElementById('synctext').textContent=t;document.getElementById('cloudstatus').textContent=t;document.getElementById('cloudsub').textContent=s}
function theme(){let p=PALETTES[data.theme||0];document.documentElement.style.setProperty('--a',p[1]);document.documentElement.style.setProperty('--s',p[2])}
function render(){theme();renderFilters();renderCalendar();renderDay();renderRight();renderSummary();renderSubjects();renderStats();const mobileDay=page==='calendar'&&view==='day'&&window.matchMedia('(max-width: 900px)').matches;document.getElementById('calendarCard').classList.toggle('hide',page!=='calendar'||mobileDay);document.getElementById('dayCard').classList.toggle('hide',page!=='calendar'||!mobileDay);document.querySelector('.right').classList.toggle('hide',page==='calendar'&&(view==='agenda'||mobileDay));document.getElementById('subjectPage').classList.toggle('hide',page!=='subjects');document.getElementById('statsPage').classList.toggle('hide',page!=='stats');[['cal','calendar'],['sub','subjects'],['stats','stats']].forEach(([id,p])=>document.getElementById('nav'+id).classList.toggle('active',page===p))}
function move(n){if(view==='month'){let d=D(cursor);d.setDate(1);d.setMonth(d.getMonth()+n);cursor=iso(d)}else cursor=plus(cursor,n*(view==='week'?7:1));selected=cursor;render()}function today(){cursor=selected=todayISO();render()}function choose(s){selected=cursor=s;render()}
function chip(e,card=false){const completed=e.done&&e.type!=='Exámenes';return `<button class="chip text-left w-full ${completed?'done-chip':''}" data-event-id="${e.id}" draggable="true" ondragstart="eventDragStart(event,'${e.id}')" ondragend="eventDragEnd(event)" style="background:${color(e)}22;color:#35405a;border-left:3px solid ${color(e)};${card?'white-space:normal;font-size:12px':''}" onclick="event.stopPropagation();if(!suppressEventClick)eventForm('${e.id}')"><b class="${completed?'line-through':''}">${esc(e.title)}</b><span class="block text-[10px] mt-1" style="color:${color(e)}">${esc(subject(e.subjectId)?.name||'Sin asignatura')} · ${esc(e.type)}${e.time?' · '+esc(e.time):''}</span></button>`}
function monthCellClick(ev,date){if(window.matchMedia('(max-width: 900px)').matches){choose(date);return}if(ev.target.closest('button,.num'))return;selected=cursor=date;eventFormForDate(date)}function eventFormForDate(date){selected=date;eventForm();const f=document.querySelector('#modal form [name="date"]');if(f)f.value=date;renderDay();renderRight()}
function renderCalendar(){let root=document.getElementById('calendar'),d=D(cursor),title;if(view==='agenda'){let all=data.events.filter(e=>visible(e)&&matches(e)).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));let groups={};all.forEach(e=>(groups[e.date]??=[]).push(e));title='Agenda';root.innerHTML=Object.keys(groups).length?Object.keys(groups).map(date=>`<section class="mb-5" data-drop-date="${date}" ondragover="eventDragOver(event)" ondragleave="eventDragLeave(event)" ondrop="eventDrop(event,'${date}')"><button class="w-full text-left font-semibold text-sm rounded-xl p-3 mb-2" style="background:var(--s)" onclick="selected=cursor='${date}';view='day';render()">${fmt(date)} <span class="muted font-normal">· ${groups[date].length} evento${groups[date].length===1?'':'s'}</span></button><div class="space-y-2">${groups[date].map(e=>`<div class="agenda-event flex items-start gap-3 rounded-xl p-3" data-event-id="${e.id}" draggable="true" ondragstart="eventDragStart(event,'${e.id}')" ondragend="eventDragEnd(event)" style="border:1px solid var(--line)"><i class="dot mt-2" style="background:${color(e)};width:10px;height:10px"></i><button class="min-w-0 flex-1 text-left" onclick="if(!suppressEventClick)eventForm('${e.id}')"><b class="block text-sm ${e.done&&e.type!=='Exámenes'?'line-through opacity-60':''}">${esc(e.title)}</b><span class="text-xs muted">${esc(subject(e.subjectId)?.name||'Sin asignatura')} · ${esc(e.type)}${e.time?' · '+esc(e.time):''}</span>${e.notes?`<span class="block text-xs muted mt-1">${esc(e.notes)}</span>`:''}</button>${e.type!=='Exámenes'?`<input type="checkbox" aria-label="Marcar como completado" ${e.done?'checked':''} onchange="done('${e.id}',this.checked)">`:''}<button class="muted" onclick="eventForm('${e.id}')">✎</button></div>`).join('')}</div></section>`).join(''):'<p class="text-sm muted text-center p-8">No hay eventos para mostrar.</p>'}else if(view==='month'){title=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'});let f=new Date(d.getFullYear(),d.getMonth(),1,12),start=plus(iso(f),-((f.getDay()+6)%7)),h='<div class="month">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let s=plus(start,i),ev=events(s),same=s.slice(0,7)===cursor.slice(0,7),shown=ev.slice(0,2),remaining=Math.max(0,ev.length-shown.length);h+=`<div class="cell ${s===selected?'sel':''}" data-drop-date="${s}" ondragover="eventDragOver(event)" ondragleave="eventDragLeave(event)" ondrop="eventDrop(event,'${s}')" onclick="monthCellClick(event,'${s}')"><div class="num ${s===todayISO()?'today':''}" role="button" tabindex="0" onclick="event.stopPropagation();choose('${s}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();choose('${s}')}" style="${same?'':'opacity:.35'}">${D(s).getDate()}</div><div class="hidden sm:block">${shown.map(e=>chip(e)).join('')}${remaining?`<button class="month-more" onclick="event.stopPropagation();choose('${s}')">+${remaining} más</button>`:''}</div><div class="flex gap-1 justify-center mt-2 sm:hidden">${ev.slice(0,5).map(e=>`<i class="dot" style="background:${color(e)}"></i>`).join('')}${ev.length>5?`<span class="text-[9px] muted">+${ev.length-5}</span>`:''}</div></div>`}root.innerHTML=h+'</div>'}else if(view==='week'){let s=plus(cursor,-((d.getDay()+6)%7));title='Semana · '+fmt(s,{day:'numeric',month:'short'});root.innerHTML=`<div class="grid sm:grid-cols-2 lg:grid-cols-7 gap-2">${Array.from({length:7},(_,i)=>{let x=plus(s,i);return `<div class="p-2 rounded-xl min-h-36" data-drop-date="${x}" ondragover="eventDragOver(event)" ondragleave="eventDragLeave(event)" ondrop="eventDrop(event,'${x}')" style="border:1px solid var(--line);background:${x===selected?'#f7f5ff':'white'}" onclick="choose('${x}')"><div class="text-xs muted mb-2">${fmt(x,{weekday:'short',day:'numeric',month:'short'})}</div>${events(x).map(e=>chip(e,true)).join('')||'<p class="text-xs muted">Sin eventos</p>'}</div>`}).join('')}</div>`}else{title=fmt(cursor);root.innerHTML=`<p class="text-xs muted mb-3">${events(cursor).length} eventos</p>${events(cursor).map(e=>chip(e,true)).join('')||'<p class="text-sm muted p-6 text-center">No hay eventos este día.</p>'}`}document.getElementById('period').textContent=title}
function renderDay(){let es=events(selected).filter(e=>e.type!=='Exámenes');document.getElementById('daytitle').textContent=fmt(selected);document.getElementById('daymeta').textContent=`${es.length} eventos · ${es.filter(e=>!e.done).length} pendientes`;document.getElementById('dayevents').setAttribute('data-drop-date',selected);document.getElementById('dayevents').setAttribute('ondragover','eventDragOver(event)');document.getElementById('dayevents').setAttribute('ondragleave','eventDragLeave(event)');document.getElementById('dayevents').setAttribute('ondrop',`eventDrop(event,\'${selected}\')`);document.getElementById('dayevents').innerHTML=es.map(e=>{let completed=e.done&&e.type!=='Exámenes';return `<div class="task ${completed?'done':''}">${e.type!=='Exámenes'?`<input type="checkbox" ${completed?'checked':''} aria-label="Marcar como completado" onchange="done('${e.id}',this.checked)">`:''}<i class="dot" style="background:${color(e)}"></i><button class="flex-1 text-left min-w-0" onclick="eventForm('${e.id}')"><span class="tasktitle block text-sm font-medium">${esc(e.title)}</span><span class="block text-xs muted">${esc(subject(e.subjectId)?.name||'Sin asignatura')} · ${esc(e.type)}${e.time?' · '+esc(e.time):''}</span></button><button onclick="eventForm('${e.id}')">✎</button><button onclick="delEvent('${e.id}')">×</button></div>`}).join('')||'<p class="text-sm muted text-center py-5">No hay eventos. ¡Puedes añadir uno!</p>'}
function renderRight(){document.getElementById('rightdate').textContent=fmt(selected);document.getElementById('rightdetails').innerHTML=events(selected).filter(e=>e.type!=='Exámenes').map(e=>{let completed=e.done;return `<div class="p-3 rounded-xl" style="background:${color(e)}20;border-left:3px solid ${color(e)}"><div class="flex items-start gap-2"><input class="mt-1 shrink-0" type="checkbox" aria-label="Marcar ${esc(e.title)} como completado" ${completed?'checked':''} onchange="done('${e.id}',this.checked)"><button class="min-w-0 flex-1 text-left" onclick="eventForm('${e.id}')"><b class="text-sm ${completed?'line-through opacity-60':''}">${esc(e.title)}</b><p class="text-xs muted mt-1 ${completed?'line-through':''}">${esc(subject(e.subjectId)?.name||'Sin asignatura')} · ${esc(e.type)}${e.time?' · '+esc(e.time):''}</p></button><button class="text-xs muted" aria-label="Editar evento" onclick="eventForm('${e.id}')">✎</button></div></div>`}).join('')||'<p class="text-sm muted">No hay tareas, entregas o planning para este día.</p>'}
function renderSummary(){let es=data.events.filter(e=>e.date.slice(0,7)===cursor.slice(0,7)&&visible(e));document.getElementById('summary').innerHTML=CATS.map(c=>`<div><div class="flex justify-between text-xs mb-1"><span>${c}</span><b>${es.filter(e=>e.type===c).length}</b></div><div class="h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full" style="width:${es.length?es.filter(e=>e.type===c).length/es.length*100:0}%;background:${CATCOL[c]}"></div></div></div>`).join('')}
function renderFilters(){document.getElementById('alltoggle').classList.toggle('on',data.subjects.every(s=>s.visible));let globalCats=`<div class="rounded-xl p-2 mb-3" style="background:#faf9fe;border:1px solid var(--line)"><div class="flex justify-between items-center text-xs"><span>Mostrar eventos completados</span><button class="switch ${data.showCompleted!==false?'on':''}" aria-label="Mostrar u ocultar eventos completados" title="Mostrar u ocultar eventos completados" onclick="toggleCompletedVisibility()"></button></div></div><div class="rounded-xl p-2 mb-4" style="background:#faf9fe;border:1px solid var(--line)"><div class="text-[11px] font-semibold muted mb-2">CATEGORÍAS · TODAS LAS ASIGNATURAS</div>${CATS.map(c=>`<div class="flex justify-between items-center text-xs py-1"><span class="flex items-center gap-2"><i class="dot" style="background:${CATCOL[c]}"></i>${c}</span><button class="switch ${data.filters[c]!==false?'on':''}" aria-label="Mostrar u ocultar ${c} en todas las asignaturas" title="Mostrar u ocultar ${c} en todas las asignaturas" onclick="toggleGlobalCategory('${c}')"></button></div>`).join('')}</div>`;document.getElementById('filters').innerHTML=globalCats+data.subjects.map(s=>{if(!s.categoryVisibility)s.categoryVisibility=Object.fromEntries(CATS.map(c=>[c,true]));return `<div class="mb-3"><div class="flex justify-between items-center text-xs font-semibold mb-2"><span class="truncate">${esc(s.name)}</span><button class="switch ${s.visible?'on':''}" aria-label="Mostrar u ocultar asignatura" onclick="toggleSubject('${s.id}')"></button></div>${CATS.map(c=>`<div class="flex justify-between items-center text-xs pl-3 py-1"><span class="flex items-center gap-2"><i class="dot" style="background:${catColor(s,c)}"></i>${c}</span><button class="switch ${categoryVisible(s,c)?'on':''}" aria-label="Mostrar u ocultar ${c} de ${esc(s.name)}" onclick="toggleCategory('${s.id}','${c}')"></button></div>`).join('')}</div>`}).join('')}
function renderSubjects(){document.getElementById('sublist').innerHTML=data.subjects.map(s=>`<div class="flex gap-2 items-center text-xs"><i class="dot" style="background:${s.color};width:10px;height:10px"></i><span class="flex-1 truncate">${esc(s.name)}</span><button onclick="subjectForm('${s.id}')">✎</button></div>`).join('');document.getElementById('subjectmanage').innerHTML=data.subjects.map(s=>{if(!s.categoryVisibility)s.categoryVisibility=Object.fromEntries(CATS.map(c=>[c,true]));return `<div class="p-4 rounded-xl" style="border:1px solid var(--line)"><div class="flex items-center gap-2"><i class="dot" style="background:${s.color}"></i><b class="flex-1">${esc(s.name)}</b><button class="btn" onclick="subjectForm('${s.id}')">Editar</button></div><p class="text-xs muted mt-2">${data.events.filter(e=>e.subjectId===s.id).length} eventos</p><div class="mt-3 space-y-2"><p class="text-xs muted">Subapartados</p>${CATS.map(c=>`<div class="flex items-center gap-2 text-sm"><i class="dot" style="background:${catColor(s,c)}"></i><span class="flex-1">${c}</span><button class="switch ${categoryVisible(s,c)?'on':''}" aria-label="Mostrar u ocultar ${c}" onclick="toggleCategory('${s.id}','${c}')"></button></div>`).join('')}</div></div>`}).join('')}
function renderStats(){let n=data.events.length,d=data.events.filter(e=>e.done).length;document.getElementById('stats').innerHTML=`<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">${[['Eventos',n],['Pendientes',n-d],['Completados',d],['Asignaturas',data.subjects.length]].map(([a,b])=>`<div class="p-4 rounded-xl" style="background:var(--s)"><p class="text-xs muted">${a}</p><b class="text-2xl">${b}</b></div>`).join('')}</div><h3 class="font-medium mb-3">Por categoría</h3>${CATS.map(c=>`<div class="flex items-center gap-3 mb-3 text-sm"><span class="w-24">${c}</span><div class="flex-1 h-2 bg-slate-100 rounded-full"><div class="h-2 rounded-full" style="width:${n?data.events.filter(e=>e.type===c).length/n*100:0}%;background:${CATCOL[c]}"></div></div>${data.events.filter(e=>e.type===c).length}</div>`).join('')}<div class="mt-6"><b class="text-sm">Tema de la aplicación</b><div class="flex gap-2 flex-wrap mt-2">${PALETTES.map((p,i)=>`<button class="btn" onclick="data.theme=${i};persist();render()"><i class="dot mr-1" style="background:${p[1]}"></i>${p[0]}</button>`).join('')}</div></div>`}
let draggedEventId='',dragStartPoint=null,suppressEventClick=false,dragMoved=false;
function eventDragStart(ev,id){draggedEventId=id;dragMoved=false;try{ev.dataTransfer.setData('text/plain',id);ev.dataTransfer.effectAllowed='move'}catch(_){}ev.currentTarget.classList.add('dragging')}
function eventDragEnd(ev){ev.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));setTimeout(()=>{draggedEventId='';suppressEventClick=false},0)}
function eventDragOver(ev){if(!draggedEventId)return;ev.preventDefault();ev.dataTransfer&&(ev.dataTransfer.dropEffect='move');ev.currentTarget.classList.add('drop-target')}
function eventDragLeave(ev){if(!ev.currentTarget.contains(ev.relatedTarget))ev.currentTarget.classList.remove('drop-target')}
function eventDrop(ev,date){ev.preventDefault();ev.stopPropagation();let id=draggedEventId||ev.dataTransfer?.getData('text/plain');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(!id)return;moveEventToDate(id,date)}
function moveEventToDate(id,date){let e=data.events.find(x=>x.id===id);if(!e||!date||e.date===date)return;if(!confirm(`¿Mover «${e.title}» al ${fmt(date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}?`))return;e.date=date;selected=cursor=date;persist();render();toast('Evento movido al '+fmt(date,{day:'numeric',month:'short'}))}
/* En tabletas táctiles, el arrastre se detecta con el puntero; en móviles se desactiva. */
document.addEventListener('pointerdown',ev=>{if(ev.pointerType!=='touch'||window.matchMedia('(max-width: 600px)').matches)return;let el=ev.target.closest('[data-event-id]');if(!el)return;dragStartPoint={x:ev.clientX,y:ev.clientY,id:el.dataset.eventId,el};dragMoved=false},{passive:true});
document.addEventListener('pointermove',ev=>{if(!dragStartPoint||window.matchMedia('(max-width: 600px)').matches)return;if(Math.hypot(ev.clientX-dragStartPoint.x,ev.clientY-dragStartPoint.y)>9){dragMoved=true;suppressEventClick=true;draggedEventId=dragStartPoint.id;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop-date]');if(target)target.classList.add('drop-target');}},{passive:true});
document.addEventListener('pointerup',ev=>{if(!dragStartPoint)return;let start=dragStartPoint;dragStartPoint=null;if(!dragMoved)return;let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop-date]');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(target)moveEventToDate(start.id,target.dataset.dropDate);setTimeout(()=>{suppressEventClick=false;draggedEventId=''},100)},{passive:true});
function done(id,v){let e=data.events.find(x=>x.id===id);if(e&&e.type!=='Exámenes'){e.done=v;persist();render()}}function toggleAll(){let v=!data.subjects.every(s=>s.visible);data.subjects.forEach(s=>s.visible=v);persist();render()}
function eventForm(id=''){let e=data.events.find(x=>x.id===id)||{id:'',title:'',date:selected,subjectId:data.subjects[0]?.id||'',type:'Tascas',time:'',notes:'',done:false,customColor:''};document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><form class="modal space-y-4" onsubmit="saveEvent(event,'${e.id}')"><div class="flex justify-between"><h2 class="text-xl font-semibold">${id?'Editar evento':'Nuevo evento'}</h2><button type="button" class="btn" onclick="closeModal()">×</button></div><label class="block text-sm">Título<input class="field mt-1" name="title" required maxlength="140" value="${esc(e.title)}"></label><div class="grid sm:grid-cols-2 gap-3"><label class="text-sm">Fecha<input class="field mt-1" name="date" type="date" required value="${e.date}"></label><label class="text-sm">Hora (opcional)<input class="field mt-1" name="time" type="time" value="${esc(e.time)}"></label><label class="text-sm">Asignatura<select class="field mt-1" name="subjectId" onchange="updateEventAutoColor()"><option value="">Sin asignatura</option>${data.subjects.map(s=>`<option value="${s.id}" ${e.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="text-sm">Categoría<select class="field mt-1" name="type" onchange="updateEventAutoColor()">${CATS.map(c=>`<option ${e.type===c?'selected':''}>${c}</option>`).join('')}</select></label><p class="text-xs muted sm:col-span-2">La categoría es el subapartado de esta asignatura y determina automáticamente el color.</p></div><label class="block text-sm">Color personalizado (opcional)<input class="field mt-1 h-11" type="color" name="customColor" value="${e.customColor||color(e)}"></label><label class="block text-sm">Notas<textarea class="field mt-1" rows="3" name="notes">${esc(e.notes)}</textarea></label><label class="flex gap-2 text-sm items-center"><input type="checkbox" name="done" ${e.done?'checked':''}> Completado</label><div class="flex justify-end gap-2"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar</button></div></form></div>`}
function catColor(s,cat){let base=s?.color||'#bbc2d4';return cat==='Exámenes'?base:cat==='Entregas'?lighten(base,.22):cat==='Tascas'?lighten(base,.43):cat==='Planning'?lighten(base,.66):base}
function updateEventAutoColor(){let form=document.querySelector('#modal form');if(!form)return;let sub=form.querySelector('[name=subjectId]')?.value||'',type=form.querySelector('[name=type]')?.value||'Tascas',c=catColor(subject(sub),type),inp=form.querySelector('[name=customColor]');if(inp)inp.value=c}
function saveEvent(ev,id){ev.preventDefault();let f=new FormData(ev.target),cc=f.get('customColor'),sub=f.get('subjectId'),type=f.get('type');let automatic=catColor(subject(sub),type);if(String(cc).toLowerCase()===String(automatic).toLowerCase())cc='';let e={id:id||uid(),title:String(f.get('title')).trim(),date:f.get('date'),time:f.get('time'),subjectId:sub,type:type,notes:f.get('notes'),done:f.get('done')==='on',customColor:cc};if(id){let i=data.events.findIndex(x=>x.id===id);data.events[i]=e}else data.events.push(e);selected=cursor=e.date;closeModal();persist();render();toast('Evento guardado')}
function delEvent(id){if(confirm('¿Eliminar este evento?')){data.events=data.events.filter(e=>e.id!==id);persist();render()}}
function toggleGlobalCategory(cat){data.filters[cat]=data.filters[cat]===false;persist();render()}function toggleCompletedVisibility(){data.showCompleted=data.showCompleted===false;persist();render()}
function toggleCategory(sid,cat){let s=subject(sid);if(!s)return;if(!s.categoryVisibility)s.categoryVisibility=Object.fromEntries(CATS.map(c=>[c,true]));s.categoryVisibility[cat]=s.categoryVisibility[cat]===false;persist();render()}
function toggleSubject(sid){let s=subject(sid);if(s){s.visible=!s.visible;persist();render()}}
function subjectForm(id=''){let s=subject(id)||{id:'',name:'',color:SUBCOL[data.subjects.length%SUBCOL.length],visible:true};document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><form class="modal space-y-4" onsubmit="saveSubject(event,'${id}')"><div class="flex justify-between"><h2 class="text-xl font-semibold">${id?'Editar asignatura':'Nueva asignatura'}</h2><button type="button" class="btn" onclick="closeModal()">×</button></div><label class="block text-sm">Nombre<input class="field mt-1" name="name" required value="${esc(s.name)}"></label><label class="block text-sm">Color<input class="field mt-1 h-12" type="color" name="color" value="${s.color}"></label><label class="flex gap-2 text-sm"><input type="checkbox" name="visible" ${s.visible?'checked':''}> Visible</label><div class="flex justify-between"><span>${id?`<button type="button" class="btn" onclick="deleteSubject('${id}')">Eliminar</button>`:''}</span><div class="flex gap-2"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar</button></div></div></form></div>`}
function saveSubject(ev,id){ev.preventDefault();let f=new FormData(ev.target),name=String(f.get('name')).trim();if(data.subjects.some(s=>s.name.toLowerCase()===name.toLowerCase()&&s.id!==id)){toast('Ya existe esa asignatura');return}if(id){let s=subject(id);s.name=name;s.color=f.get('color');s.visible=f.get('visible')==='on';if(!s.categoryVisibility)s.categoryVisibility=Object.fromEntries(CATS.map(c=>[c,true]))}else data.subjects.push({id:uid(),name,color:f.get('color'),visible:f.get('visible')==='on',categoryVisibility:Object.fromEntries(CATS.map(c=>[c,true]))});closeModal();persist();render()}
function deleteSubject(id){if(!confirm('¿Eliminar asignatura? Los eventos se conservarán sin asignatura.'))return;data.events.forEach(e=>{if(e.subjectId===id)e.subjectId=''});data.subjects=data.subjects.filter(s=>s.id!==id);closeModal();persist();render()}
function closeModal(){document.getElementById('modal').innerHTML=''}function toast(s){document.getElementById('toast').innerHTML=`<div class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white rounded-xl px-4 py-3 text-sm z-50">${esc(s)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',2300)}
function settings(){document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal space-y-4"><div class="flex justify-between"><h2 class="text-xl font-semibold">Ajustes</h2><button class="btn" onclick="closeModal()">×</button></div><p class="text-sm muted">Tema de la interfaz</p><div class="flex flex-wrap gap-2">${PALETTES.map((p,i)=>`<button class="btn" onclick="data.theme=${i};persist();render();settings()"><i class="dot mr-1" style="background:${p[1]}"></i>${p[0]}</button>`).join('')}</div><div class="flex justify-between items-center py-2"><div><b class="text-sm">Eventos completados</b><p class="text-xs muted">Mostrar u ocultar los eventos tachados en todas las vistas.</p></div><button class="switch ${data.showCompleted!==false?'on':''}" aria-label="Mostrar u ocultar eventos completados" onclick="toggleCompletedVisibility();settings()"></button></div><hr><p class="text-sm muted">Copia de seguridad local opcional (no sustituye la sincronización automática).</p><button class="btn" onclick="backup()">Descargar JSON</button><label class="btn ml-2">Importar JSON<input class="hidden" type="file" accept="application/json" onchange="restore(event)"></label><hr><p class="text-xs muted">La nube utiliza B1 para Agenda Bloom y mantiene A1 de la agenda anterior intacta. Actualiza y despliega Code_AgendaBloom.gs antes de activar esta conexión.</p><button class="btn primary" onclick="sync()">Probar sincronización</button></div></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='agenda-bloom-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(ev){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.schema!==1||!Array.isArray(d.events)||!Array.isArray(d.subjects))throw 0;if(confirm('¿Reemplazar los datos locales de Agenda Bloom?')){data=d;persist();render();closeModal()}}catch(e){toast('Archivo no válido')}};r.readAsText(ev.target.files[0])}
async function sync(){if(busy)return;busy=true;status('busy','Sincronizando…','Consultando el espacio Agenda Bloom en la hoja.');try{let res=await fetch(URL_SCRIPT+'?app=agendaBloom',{cache:'no-store'});if(!res.ok)throw Error('GET '+res.status);let r=await res.json();if(r.app!=='agendaBloom')throw Error('El Apps Script aún no está actualizado.');remoteVersion=Number(r.version||0);if(r.payload&&r.payload.schema===1&&!dirty){data=r.payload;localStorage.setItem(KEY,JSON.stringify(data));render()}else if(r.payload&&r.payload.schema===1&&Number(r.payload.updatedAt)>Number(data.updatedAt)){status('err','Posible conflicto','La nube contiene datos más recientes. Tus cambios locales se conservan; revisa antes de sincronizar.');return}
const body=JSON.stringify({app:'agendaBloom',baseVersion:remoteVersion,payload:data});await fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});localStorage.setItem(KEY,JSON.stringify(data));dirty=false;status('ok','Enviado a la nube','El navegador no permite verificar la respuesta POST; se comprobará en la próxima lectura.')}catch(e){status('err','Sin sincronización','Tus datos locales siguen guardados. Actualiza el Apps Script y despliega una nueva versión.');console.error(e)}finally{busy=false}}
function pageTo(p){page=p;render()}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{data=JSON.parse(e.newValue);render()}catch(_){}}});
render();setTimeout(sync,500);
</script></body></html>
